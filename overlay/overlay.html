<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="overlay.css">
</head>
<body class="view">
  <svg id="canvas">
    <g id="scroll-g">
      <g id="hl-layer"></g>
      <g id="ink-layer"></g>
    </g>
  </svg>
  <div id="notes"></div>
  <div id="frame"></div>

  <!-- 查看模式下的小入口:悬停可点,进入标注 -->
  <button id="chip" class="hoverable" title="标注这个窗口 (Ctrl+Alt+A)">✎</button>

  <!-- 绑定状态牌:查看模式短暂提示标注到底"跟随滚动中"还是"只钉在窗口上",让跟随不再是黑箱 -->
  <div id="bind-badge"></div>

  <!-- 透明度提示:画笔模式下滚轮调标注透明度时,短暂显示"标注 60%" -->
  <div id="ink-badge"></div>

  <!-- 截图完成提示:点 📷 截完窗口(含标注)后短暂显示"已复制到剪贴板" -->
  <div id="shot-toast"></div>

  <!-- 标注模式工具条 -->
  <div id="toolbar" class="hoverable">
    <div id="tool-ink"></div><!-- 滑动的高亮胶囊:在工具间平滑滑动,指示当前工具 -->
    <span id="app-name"></span>
    <button id="wheel-mode" title="滚轮作用:透明度 / 缩放(点击或右键切换)">◧</button>
    <span class="sep"></span>
    <button class="tool active" data-tool="pen"    title="画笔">✏️</button>
    <button class="tool" data-tool="arrow"  title="箭头">↗</button>
    <button class="tool" data-tool="rect"   title="方框(框住重点)">▭</button>
    <button class="tool" data-tool="hl"     title="荧光笔(划一道自动拉平)">▆</button>
    <button class="tool" data-tool="note"   title="手写便签">Aa</button>
    <button class="tool" data-tool="eraser" title="橡皮(点谁擦谁)">⌫</button>
    <span class="sep"></span>
    <span id="colors"></span>
    <button id="eyedropper" title="从屏幕上取色(吸管)· 取到的颜色作为画笔色">
      <svg class="ic" viewBox="0 0 24 24"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4Z"/></svg></button>
    <span class="sep"></span>
    <button id="shot"  title="截图当前窗口(含标注),复制到剪贴板">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 9a2 2 0 0 1 2-2h1.6l.9-1.5A1 1 0 0 1 9.4 5h5.2a1 1 0 0 1 .9.5L16.4 7H18a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.8" r="3"/></svg></button>
    <button id="undo"  title="撤销 (Ctrl+Z)">
      <svg class="ic" viewBox="0 0 24 24"><path d="M8 5 4 9l4 4"/><path d="M4 9h9a5 5 0 0 1 0 10h-1"/></svg></button>
    <button id="clear" title="清空本窗口标注">
      <svg class="ic" viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9.5 7V5.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V7"/><path d="M6.7 7l.8 11.4a1.4 1.4 0 0 0 1.4 1.3h6.2a1.4 1.4 0 0 0 1.4-1.3L18 7"/></svg></button>
    <button id="done"  title="完成,回到正常使用 (Esc)">完成</button>
  </div>

<script src="overlay.js"></script>
</body>
</html>
