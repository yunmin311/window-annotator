<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: transparent; overflow: hidden;
    font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; }
  body { padding: 18px; }                 /* 窗口透明,四周留出阴影空间(与 tray-pos 的 pad 对齐) */

  /* 卡片:磨砂玻璃,浅色为默认、深色跟随系统(见底部 @media)。比上一版更小、左列更窄 */
  .menu {
    display: flex; flex-direction: column;
    width: max-content; min-width: 174px;
    background: rgba(250, 250, 251, .80);
    -webkit-backdrop-filter: blur(26px) saturate(1.7);
    backdrop-filter: blur(26px) saturate(1.7);
    border: 1px solid rgba(0, 0, 0, .07);
    border-radius: 10px; padding: 5px;
    box-shadow: 0 10px 32px rgba(0, 0, 0, .18), 0 1px 2px rgba(0, 0, 0, .10),
                inset 0 1px 0 rgba(255, 255, 255, .8);
    color: #1e1e21; font-size: 12.5px;
  }

  .row { display: flex; align-items: center; gap: 7px;
    height: 28px; padding: 0 12px 0 7px; border-radius: 6px;
    white-space: nowrap; cursor: default; }
  .row[data-action] { cursor: pointer; }
  .row[data-action]:hover { background: rgba(0, 0, 0, .055); }

  /* 左列:只留一个 11px 的对勾位,尽量收窄 */
  .row .ck { flex: 0 0 11px; width: 11px; text-align: center;
    color: #12a150; font-size: 11px; opacity: 0; }
  .row.on .ck { opacity: 1; }
  .row .tx { flex: 1; }
  .row .sc { margin-left: 16px; color: rgba(0, 0, 0, .4); font-size: 11px; letter-spacing: .2px; }

  .row.info { height: 24px; color: rgba(0, 0, 0, .42); }
  .row.info .tx { font-size: 11.5px; }

  .sep { height: 1px; background: rgba(0, 0, 0, .08); margin: 4px 7px; }

  .row.quit:hover { background: rgba(229, 72, 77, .92); color: #fff; }  /* 退出=危险动作,悬停变红 */

  /* 深色:跟随系统主题(系统切到深色时整套换深) */
  @media (prefers-color-scheme: dark) {
    .menu {
      background: rgba(32, 32, 35, .72);
      border-color: rgba(255, 255, 255, .09);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .08);
      color: rgba(255, 255, 255, .92);
    }
    .row[data-action]:hover { background: rgba(255, 255, 255, .10); }
    .row .ck { color: #6bd39a; }
    .row .sc { color: rgba(255, 255, 255, .4); }
    .row.info { color: rgba(255, 255, 255, .45); }
    .sep { background: rgba(255, 255, 255, .09); }
  }
</style>
</head>
<body>
  <div class="menu">
    <div class="row info"><span class="ck"></span><span class="tx">标注当前窗口</span><span class="sc" id="sc-annotate">—</span></div>
    <div class="row info"><span class="ck"></span><span class="tx">退出程序</span><span class="sc" id="sc-quit">—</span></div>
    <div class="sep"></div>
    <div class="row" id="row-autostart" data-action="autostart"><span class="ck">✓</span><span class="tx">开机自动启动</span></div>
    <div class="row" id="row-follow" data-action="follow"><span class="ck">✓</span><span class="tx">跟随页面滚动</span></div>
    <div class="sep"></div>
    <div class="row" data-action="open"><span class="ck"></span><span class="tx">打开标注存档文件夹</span></div>
    <div class="row quit" data-action="quit"><span class="ck"></span><span class="tx">退出</span></div>
  </div>

<script>
  const { ipcRenderer } = require('electron');
  const PAD = 18;
  const card = document.querySelector('.menu');

  // 量出卡片实际尺寸,回报主进程去定位 + 调窗口大小(这就是"自适应"—— 有多少内容占多大)
  function report() {
    const r = card.getBoundingClientRect();
    const cardW = Math.ceil(r.width), cardH = Math.ceil(r.height);
    ipcRenderer.send('menu-size', { cardW, cardH, pad: PAD, winW: cardW + 2 * PAD, winH: cardH + 2 * PAD });
  }
  function setOn(id, on) { document.getElementById(id).classList.toggle('on', !!on); }

  // 每次要弹之前,主进程把当前状态发来:填快捷键 + 打勾,量完再报尺寸
  ipcRenderer.on('menu-state', (e, s) => {
    document.getElementById('sc-annotate').textContent = s.annotateKey || '—';
    document.getElementById('sc-quit').textContent = s.quitKey || '—';
    setOn('row-autostart', s.autostart);
    setOn('row-follow', s.follow);
    requestAnimationFrame(report);
  });

  document.body.addEventListener('click', (ev) => {
    const row = ev.target.closest('[data-action]');
    if (row) ipcRenderer.send('tray-action', row.dataset.action);
  });
  window.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') ipcRenderer.send('tray-action', 'close'); });
</script>
</body>
</html>
